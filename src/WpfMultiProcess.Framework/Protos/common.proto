syntax = "proto3";

option csharp_namespace = "WpfMultiProcess.Ipc.Common";

package ipc.common;

// 会话建立本身已经并入各 feature 自己的 server-stream Register(见 waveform.proto /
// table.proto 的 StreamRequest{session_id, hwnd, pid}),这里只剩下真正 feature-无关、
// 且不方便挂在 stream 上的 unary:子进程 UI 线程回 Pong、上报 UI 线程饱和度。
// session_id 本身由主进程在拉起子进程前生成,当启动参数传入,不再靠一次 Register RPC
// 换取。
//
// 原来这里还有一个 RequestActivate(子窗口 WS_EX_NOACTIVATE 时点击不会自己抢激活,
// 靠它上报"我被点了"换取主进程 Activate() 补偿)。子窗口改为全部可激活后(见
// Framework 的 ChildWindow),点击会被系统正常处理,这条补偿链存在的理由消失,
// 整条删掉,不再保留。
service CommonService {
  // 子进程收到 Ping 后在 UI 线程回 Pong,证明 UI 线程存活。
  rpc Pong (PongRequest) returns (Ack);

  // 子进程 UiSaturationMeter 后台线程每窗口(约 1s)上报一次 UI 线程饱和度,
  // fire-and-forget,和 Pong 共用同一个 CommonServiceClient/Channel。
  rpc ReportUiStats (UiStatsRequest) returns (Ack);
}

// Register 时回给子进程的展示元数据,现在搭在各 feature 自己 stream 的 XxxDown
// oneof 里(第一条消息),不再是单独一个 unary 的返回值。
message RegisterReply {
  string title = 1;
  string accent_color = 2;
  map<string, string> settings = 3;
}

message PongRequest {
  string session_id = 1;
  int64 seq = 2;
  int64 ping_timestamp_ms = 3;  // 回显 Ping 的时间戳
  int64 pong_timestamp_ms = 4;  // 子进程 UI 线程处理时刻
}

// UiSaturationMeter 每窗口上报一次:saturation_pct 是后台线程 Background 优先级探针
// 积分出来的权威值(UI 卡死进行中也能报出接近 100%);其余四个字段来自
// Dispatcher.Hooks,只做归因,不作为"是否饱和"的判据。
message UiStatsRequest {
  string session_id = 1;
  double saturation_pct = 2;         // 探针权威值
  double dispatcher_busy_pct = 3;    // hooks
  double max_queue_latency_ms = 4;   // hooks
  double longest_op_ms = 5;          // hooks
  int32  op_count = 6;               // hooks
}

message Ack {
  bool ok = 1;
}

// 共享的心跳消息,直接搭在每个 feature 自己的 stream 的 oneof envelope(XxxDown)里。
// 原来还有一层 Control{ping/shutdown} 包装,现已去掉——Ping/Shutdown 直接作为 oneof
// 分支暴露,少一层 demux,也方便调库方在自己的 envelope 里按需只暴露其中一个。
message Ping {
  int64 seq = 1;
  int64 timestamp_ms = 2;
}

// 会话关闭的触发源,尽量覆盖框架已知的所有关闭路径,方便子进程侧诊断/埋点区分
// "我是被谁关掉的"。子进程侧只需要行为一致地关窗口,reason 仅用于日志/可观测性。
enum ShutdownReason {
  SHUTDOWN_REASON_UNSPECIFIED = 0;
  SHUTDOWN_REASON_HOST_CLOSING = 1;     // 主窗口关闭,全体退出
  SHUTDOWN_REASON_PANE_CLOSED = 2;      // 用户关闭了这个 pane
  SHUTDOWN_REASON_CLOSED_BY_API = 3;    // 调库方代码主动 CloseSession
  SHUTDOWN_REASON_SESSION_REJECTED = 4; // Register 校验失败被拒
  SHUTDOWN_REASON_REPLACED = 5;         // 同 session 重复连接被顶掉
  SHUTDOWN_REASON_HOST_ERROR = 6;       // 主进程内部错误
  SHUTDOWN_REASON_RESTARTING = 7;       // 预留:重启/升级
}

message Shutdown {
  ShutdownReason reason = 1;
  string detail = 2;
}
