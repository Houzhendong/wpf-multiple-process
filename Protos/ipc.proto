syntax = "proto3";

option csharp_namespace = "WpfMultiProcess.Ipc";

package ipc;

// 主进程作为 gRPC Server,子进程作为 Client。
service HostIpc {
  // 子进程订阅;主进程通过该 server stream 推送 Feature 实时数据、心跳 Ping、关闭指令。
  rpc Subscribe (SubscribeRequest) returns (stream ServerMessage);

  // 子进程 unary:获取初始化参数。
  rpc GetInitParams (InitParamsRequest) returns (InitParamsReply);

  // 子进程 unary:上传交互结果。
  rpc ReportInteraction (InteractionRequest) returns (Ack);

  // 子进程 unary:上传自己窗口的 HWND,由主进程 SetOwner + overlay。
  rpc RegisterWindow (RegisterWindowRequest) returns (Ack);

  // 子进程 unary:收到 Ping 后在 UI 线程回 Pong,证明 UI 线程存活。
  rpc Pong (PongRequest) returns (Ack);
}

message SubscribeRequest {
  string feature_id = 1;
  int32 pid = 2;
}

message ServerMessage {
  oneof payload {
    FeatureData feature = 1;
    Ping ping = 2;
    Shutdown shutdown = 3;
  }
}

message FeatureData {
  string feature_id = 1;
  int64 sequence = 2;
  double value = 3;
  string text = 4;
  int64 timestamp_ms = 5;
}

message Ping {
  int64 sequence = 1;
  int64 timestamp_ms = 2; // 主进程发出时刻(Unix ms)
}

message Shutdown {
}

message InitParamsRequest {
  string feature_id = 1;
}

message InitParamsReply {
  string title = 1;
  string accent_color = 2;          // 例如 "#007ACC"
  map<string, string> settings = 3;
}

message InteractionRequest {
  string feature_id = 1;
  string action = 2;
  string payload_json = 3;
  int64 timestamp_ms = 4;
}

message RegisterWindowRequest {
  string feature_id = 1;
  int64 hwnd = 2;
  int32 pid = 3;
}

message PongRequest {
  string feature_id = 1;
  int64 sequence = 2;
  int64 ping_timestamp_ms = 3; // 回显 Ping 的时间戳
  int64 pong_timestamp_ms = 4; // 子进程 UI 线程处理时刻
}

message Ack {
  bool ok = 1;
}
