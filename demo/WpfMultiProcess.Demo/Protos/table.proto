syntax = "proto3";

option csharp_namespace = "WpfMultiProcess.Ipc.Table";

package ipc.table;

import "common.proto";

// table feature 专属 service:会话建立(带 hwnd/pid)+ 数据流(Reply/Ping/Shutdown/Delta
// 共用一个 envelope)+ 一个 feature 专属 unary(排序)。
service TableService {
  rpc Register (StreamRequest) returns (stream TableDown);
  rpc Sort (SortRequest) returns (ipc.common.Ack);
}

message StreamRequest {
  string session_id = 1;
  int64 hwnd = 2;
  int32 pid = 3;
}

message TableDown {
  oneof kind {
    ipc.common.RegisterReply reply = 1;   // 会话建立后第一条:标题/主题色/设置
    ipc.common.Ping ping = 2;             // 心跳
    ipc.common.Shutdown shutdown = 3;     // 关闭(带 reason)
    TableDelta delta = 4;                 // 业务数据帧
  }
}

message TableDelta {
  repeated Row upserts = 1;
  repeated int64 removed_ids = 2;
  int64 seq = 3;
  repeated int64 ordered_ids = 4;
}

message Row {
  int64 id = 1;
  string name = 2;
  double value = 3;
  string status = 4;
}

message SortRequest {
  string session_id = 1;
  string field = 2;
  bool ascending = 3;
}
